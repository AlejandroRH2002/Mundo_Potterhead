# Template: supply a real image and the externally managed Secret before applying.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mundo-potterhead-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: mundo-potterhead-api
  template:
    metadata:
      labels:
        app: mundo-potterhead-api
    spec:
      terminationGracePeriodSeconds: 25
      containers:
        - name: api
          image: REPLACE_REGISTRY/mundo-potterhead-api:REPLACE_COMMIT_SHA
          ports:
            - containerPort: 3001
          env:
            - name: NODE_ENV
              value: production
            - name: API_HOST
              value: 0.0.0.0
            - name: API_PORT
              value: '3001'
            - name: DB_POOL_SIZE
              value: '5'
          envFrom:
            - secretRef:
                name: mundo-potterhead-api
          startupProbe:
            httpGet: {path: /health/live, port: 3001}
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          livenessProbe:
            httpGet: {path: /health/live, port: 3001}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /health/ready, port: 3001}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
